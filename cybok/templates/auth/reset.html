{% extends "auth/_layout.html" %}
{% block title %}Choose a new password · Cybok{% endblock %}
{% block card %}
<h1>Choose a new password</h1>
<p class="lead">You'll be signed out of all other devices.</p>
<form method="post" novalidate data-busy-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="password">New password</label>
    <div class="pw-wrap">
      <input class="input" id="password" name="password" type="password" autocomplete="new-password" required data-strength autofocus>
      <button class="icon-btn sm" type="button" data-toggle-pw aria-label="Show password"><svg class="icon sm" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="pw-meter"><i></i></div>
  </div>
  <div class="field">
    <label for="password2">Confirm new password</label>
    <input class="input" id="password2" name="password2" type="password" autocomplete="new-password" required>
  </div>
  <button class="btn brand lg" type="submit">Update password</button>
</form>
{% endblock %}
