{% extends "auth/_layout.html" %}
{% block title %}Reset password · Cybok{% endblock %}
{% block card %}
<h1>Forgot your password?</h1>
<p class="lead">Enter your e-mail and we'll send you a secure link to reset it.</p>
<form method="post" novalidate data-busy-form>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">E-mail</label>
    <input class="input" id="email" name="email" type="email" autocomplete="email" required autofocus>
  </div>
  <button class="btn brand lg" type="submit">Send reset link</button>
</form>
<p class="auth-foot"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p>
{% endblock %}
