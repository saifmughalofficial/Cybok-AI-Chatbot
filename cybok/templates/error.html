{% extends "base.html" %}
{% block title %}{{ code }} · Cybok{% endblock %}
{% block body %}
<div class="error-page">
  <div>
    <img src="{{ url_for('static', filename='img/mark.png') }}" alt="" width="72" height="72" style="margin:0 auto 18px;border-radius:20px">
    <div class="code grad-text">{{ code }}</div>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <a class="btn brand" href="/app">Go to Cybok</a>
  </div>
</div>
{% endblock %}
