<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Cybok{% endblock %}</title>
  <meta name="description" content="Cybok — Your AI. Your Workspace. Chat, create, analyze, generate and explore with an AI workspace built for everyday productivity.">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#07080d">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Michroma&display=swap" rel="stylesheet">
  <script src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_v }}"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cybok.css') }}?v={{ asset_v }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<div id="toasts" role="status" aria-live="polite"></div>
{% block scripts %}{% endblock %}
</body>
</html>
